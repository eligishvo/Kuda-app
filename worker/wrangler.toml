name = "kuda-worker"
main = "src/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Daily limit: the most SerpApi searches the Worker makes per day (resets at midnight UTC). The current plan has
# 250 searches a month, and 8 a day x 31 days = 248 stays inside it. Change it here and push to redeploy.
DAILY_SEARCH_CAP = "8"

# The cache and the daily counter. With no id here, wrangler creates the KV namespace on the first deploy.
[[kv_namespaces]]
binding = "CACHE"

# Secrets (never in this file): SERPAPI_KEY, TRAVELPAYOUTS_TOKEN, APP_TOKEN. See worker/README.md.
