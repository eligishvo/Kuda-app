# Run manually to see the latest Android builds on Expo and, when the newest one failed, the part of its
# log that says why (so the error can be read without opening expo.dev).
name: Build status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Latest builds
        run: |
          eas build:list --limit 3 --platform android --non-interactive --json > builds.json
          node scripts/build-status.js
